# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Deploys Hosted agent `ally` onto the existing CommsOS-Core Foundry project.
# Do not add a second Foundry account, Magentic graph, or prompt agent.

requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"

name: ally-runtime
services:
  ally:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Invocations Protocol
        - Bring Your Own
        - Python
    project: .
    language: python
    codeConfiguration:
      runtime: python_3_12
      entryPoint: main.py
    kind: hosted
    name: ally
    displayName: Ally
    description: Sequence-locked Ally control plane. Invocations only. Human Strategic Lock is an interrupt.
    protocols:
      - protocol: invocations
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry
