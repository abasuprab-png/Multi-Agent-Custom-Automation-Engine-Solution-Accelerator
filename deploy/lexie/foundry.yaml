# Foundry registration for hosted Lexie on existing commsos-prod.
# Build from repo root: docker build -f deploy/lexie/Dockerfile -t allyruntimeeus2.azurecr.io/lexie:<tag> .
projectEndpoint: https://commsos-prod-resource.services.ai.azure.com/api/projects/commsos-prod
accountName: commsos-prod-resource
resourceGroup: rg-rag-prototype
agentName: lexie
azureContainerRegistry: allyruntimeeus2.azurecr.io
image: allyruntimeeus2.azurecr.io/lexie:pending
cpu: "0.5"
memory: 1Gi
protocols:
  - protocol: invocations
    version: "2.0.0"
environmentVariables:
  ALLY_AGENT: lexie
  ALLY_STDLIB_HOST: "0"
# Set ALLY_LOCK_HMAC_SECRET (or Entra OIDC env) on the hosted container.
# Do not commit secrets. Unsigned or free-text invocations must throw RefusalError / LockGateError.
refusal:
  accepts: AgentHandoff
  unsigned: LockGateError
  freeText: RefusalError
